services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lane
      POSTGRES_PASSWORD: lane
      POSTGRES_DB: lane
    ports:
      - "5432:5432"
    volumes:
      - lane_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lane"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://lane:lane@postgres:5432/lane
      JWT_SECRET: change-me-in-dev
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  lane_pg:
